<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My POS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tabs button {
      flex: 1;
      padding: 16px 5px;
      border: none;
      background: white;
      font-size: 15px;
    }

    .tabs button.active {
      background: #111;
      color: white;
    }

    .content {
      padding: 18px;
      max-width: 950px;
      margin: auto;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .product:active {
      transform: scale(0.98);
      border-color: #111;
    }

    .cart,
    .summary,
    .order-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
    }

    .cart {
      margin-top: 25px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .qty-controls button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 8px;
      font-size: 20px;
    }

    .qty-controls span {
      display: inline-block;
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .total {
      margin-top: 20px;
      font-size: 30px;
      font-weight: bold;
    }

    .payment-methods {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .payment-methods button {
      flex: 1;
      padding: 16px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 18px;
    }

    .payment-methods button.selected {
      border-color: #111;
      background: #111;
      color: white;
    }

    .pay {
      width: 100%;
      padding: 20px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      background: #111;
      color: white;
    }

    .pay:disabled {
      opacity: 0.5;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }

    .summary {
      margin-bottom: 18px;
    }

    .summary-main {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 18px;
    }

    .order-card {
      margin-bottom: 12px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    .order-items {
      margin-top: 12px;
      color: #555;
      line-height: 1.7;
    }

    .order-payment {
      margin-top: 12px;
      font-weight: bold;
    }

    .empty {
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 700px) {
      .products {
        grid-template-columns: 1fr;
      }

      .tabs button {
        font-size: 12px;
        padding: 14px 3px;
      }
    }
  </style>
</head>

<body>

<header>MY POS</header>

<div class="tabs">
  <button id="tab-order" class="active"
    onclick="showPage('order')">🍔 Order</button>

  <button id="tab-today"
    onclick="showPage('today')">📋 Today</button>

  <button>💰 Expenses</button>
  <button>🧾 Closing</button>
  <button>📊 Report</button>
</div>

<div class="content">

  <!-- ORDER -->
  <div id="page-order" class="page active">

    <h2>New Order</h2>

    <div class="products">

      <div class="product"
        onclick="addItem('Chicken Burger', 5)">
        Chicken Burger<br>
        <strong>RM5.00</strong>
      </div>

      <div class="product"
        onclick="addItem('Beef Burger', 6)">
        Beef Burger<br>
        <strong>RM6.00</strong>
      </div>

      <div class="product"
        onclick="addItem('Lamb Burger', 7)">
        Lamb Burger<br>
        <strong>RM7.00</strong>
      </div>

    </div>

    <div class="cart">

      <h2>Current Order</h2>

      <div id="cartItems">
        <div class="empty">No items yet</div>
      </div>

      <div class="total">
        Total: RM<span id="total">0.00</span>
      </div>

      <div class="payment-methods">

        <button onclick="selectPayment('Cash', this)">
          💵 Cash
        </button>

        <button onclick="selectPayment('DuitNow QR', this)">
          📱 DuitNow QR
        </button>

      </div>

      <button id="confirmBtn"
        class="pay"
        onclick="confirmOrder()">
        Confirm Order
      </button>

      <div id="status" class="status"></div>

    </div>

  </div>


  <!-- TODAY -->
  <div id="page-today" class="page">

    <h2>Today's Sales</h2>

    <div id="todayContent">
      <div class="loading">Loading...</div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://sbcdrowaklgzdwsxdlxo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_C6bOQc6VROqxVcgfxfcqEQ_fG1k480J";

let cart = {};
let paymentMethod = "";


/* TAB */

function showPage(page) {

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document.querySelectorAll(".tabs button")
    .forEach(b => b.classList.remove("active"));

  document.getElementById("page-" + page)
    .classList.add("active");

  document.getElementById("tab-" + page)
    .classList.add("active");

  if (page === "today") {
    loadToday();
  }
}


/* ORDER */

function addItem(name, price) {

  if (!cart[name]) {

    cart[name] = {
      name: name,
      price: price,
      qty: 1
    };

  } else {

    cart[name].qty++;

  }

  renderCart();
}


function changeQty(name, change) {

  cart[name].qty += change;

  if (cart[name].qty <= 0) {
    delete cart[name];
  }

  renderCart();
}


function renderCart() {

  const cartItems =
    document.getElementById("cartItems");

  const totalElement =
    document.getElementById("total");

  const items =
    Object.values(cart);

  if (items.length === 0) {

    cartItems.innerHTML =
      '<div class="empty">No items yet</div>';

    totalElement.innerText =
      "0.00";

    return;
  }

  let html = "";
  let total = 0;

  items.forEach(item => {

    const itemTotal =
      item.price * item.qty;

    total += itemTotal;

    html += `
      <div class="cart-item">

        <div>
          <strong>${item.name}</strong><br>
          RM${item.price.toFixed(2)} × ${item.qty}
        </div>

        <div class="qty-controls">

          <button
            onclick="changeQty('${item.name}', -1)">
            −
          </button>

          <span>${item.qty}</span>

          <button
            onclick="changeQty('${item.name}', 1)">
            +
          </button>

        </div>

      </div>
    `;
  });

  cartItems.innerHTML = html;

  totalElement.innerText =
    total.toFixed(2);
}


function selectPayment(method, button) {

  paymentMethod = method;

  document
    .querySelectorAll(".payment-methods button")
    .forEach(btn =>
      btn.classList.remove("selected")
    );

  button.classList.add("selected");
}


async function confirmOrder() {

  const items =
    Object.values(cart);

  if (items.length === 0) {
    alert("Please add items first.");
    return;
  }

  if (!paymentMethod) {
    alert("Please select payment method.");
    return;
  }

  const confirmBtn =
    document.getElementById("confirmBtn");

  const status =
    document.getElementById("status");

  confirmBtn.disabled = true;
  confirmBtn.innerText = "Saving...";

  try {

    const total =
      items.reduce(
        (sum, item) =>
          sum + item.price * item.qty,
        0
      );

    const orderNo =
      "ORD-" + Date.now();

    const orderResponse =
      await fetch(
        SUPABASE_URL + "/rest/v1/orders",
        {
          method: "POST",

          headers: {
            apikey: SUPABASE_KEY,
            "Content-Type": "application/json",
            Prefer: "return=representation"
          },

          body: JSON.stringify({
            order_no: orderNo,
            total_amount: total,
            payment_method: paymentMethod,
            status: "paid"
          })
        }
      );

    if (!orderResponse.ok) {
      throw new Error(
        await orderResponse.text()
      );
    }

    const orderData =
      await orderResponse.json();

    const orderId =
      orderData[0].id;

    const orderItems =
      items.map(item => ({
        order_id: orderId,
        product_name: item.name,
        price: item.price,
        quantity: item.qty,
        item_total:
          item.price * item.qty
      }));

    const itemResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/order_items",
        {
          method: "POST",

          headers: {
            apikey: SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(orderItems)
        }
      );

    if (!itemResponse.ok) {
      throw new Error(
        await itemResponse.text()
      );
    }

    status.innerText =
      "✅ Order Saved | RM" +
      total.toFixed(2);

    cart = {};
    paymentMethod = "";

    document
      .querySelectorAll(
        ".payment-methods button"
      )
      .forEach(btn =>
        btn.classList.remove("selected")
      );

    renderCart();

  } catch (error) {

    console.error(error);

    alert(
      "Save failed:\n" +
      error.message
    );

  } finally {

    confirmBtn.disabled = false;
    confirmBtn.innerText =
      "Confirm Order";
  }
}


/* TODAY */

async function loadToday() {

  const container =
    document.getElementById("todayContent");

  container.innerHTML =
    '<div class="loading">Loading...</div>';

  try {

    const now = new Date();

    const start =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        0, 0, 0
      );

    const end =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() + 1,
        0, 0, 0
      );

    const ordersURL =
      SUPABASE_URL +
      "/rest/v1/orders" +
      "?select=*" +
      "&created_at=gte." +
      encodeURIComponent(start.toISOString()) +
      "&created_at=lt." +
      encodeURIComponent(end.toISOString()) +
      "&order=created_at.desc";

    const ordersResponse =
      await fetch(ordersURL, {
        headers: {
          apikey: SUPABASE_KEY
        }
      });

    if (!ordersResponse.ok) {
      throw new Error(
        await ordersResponse.text()
      );
    }

    const orders =
      await ordersResponse.json();

    if (orders.length === 0) {

      container.innerHTML =
        '<div class="summary">' +
        '<div class="summary-main">RM0.00</div>' +
        '<div>No orders today.</div>' +
        '</div>';

      return;
    }

    const ids =
      orders.map(o => o.id).join(",");

    const itemsURL =
      SUPABASE_URL +
      "/rest/v1/order_items" +
      "?select=*" +
      "&order_id=in.(" +
      ids +
      ")";

    const itemsResponse =
      await fetch(itemsURL, {
        headers: {
          apikey: SUPABASE_KEY
        }
      });

    if (!itemsResponse.ok) {
      throw new Error(
        await itemsResponse.text()
      );
    }

    const allItems =
      await itemsResponse.json();

    let totalSales = 0;
    let cash = 0;
    let qr = 0;

    orders.forEach(order => {

      const amount =
        Number(order.total_amount);

      totalSales += amount;

      if (
        order.payment_method === "Cash"
      ) {
        cash += amount;
      }

      if (
        order.payment_method ===
        "DuitNow QR"
      ) {
        qr += amount;
      }

    });

    let html = `

      <div class="summary">

        <div class="summary-main">
          RM${totalSales.toFixed(2)}
        </div>

        <div class="summary-row">
          <span>Orders</span>
          <strong>${orders.length}</strong>
        </div>

        <div class="summary-row">
          <span>💵 Cash</span>
          <strong>
            RM${cash.toFixed(2)}
          </strong>
        </div>

        <div class="summary-row">
          <span>📱 DuitNow QR</span>
          <strong>
            RM${qr.toFixed(2)}
          </strong>
        </div>

      </div>
    `;

    orders.forEach(order => {

      const items =
        allItems.filter(
          item =>
            item.order_id === order.id
        );

      const time =
        new Date(
          order.created_at
        ).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

      let itemText = "";

      items.forEach(item => {

        itemText += `
          ${item.product_name}
          × ${item.quantity}
          — RM${Number(
            item.item_total
          ).toFixed(2)}
          <br>
        `;

      });

      html += `

        <div class="order-card">

          <div class="order-top">

            <span>
              Order #${order.id}
            </span>

            <span>
              RM${Number(
                order.total_amount
              ).toFixed(2)}
            </span>

          </div>

          <div class="order-items">
            ${itemText}
          </div>

          <div class="order-payment">
            ${order.payment_method}
            · ${time}
          </div>

        </div>
      `;

    });

    container.innerHTML = html;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      "❌ Cannot load today's orders.";

  }
}

</script>

</body>
</html>
</body>
</html>
